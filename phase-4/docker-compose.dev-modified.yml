services:
  backend:
    build:
      context: ..
      dockerfile: ./phase-4/docker/backend.dev.Dockerfile
    container_name: phase4-backend-dev
    ports:
      - "4001:8000"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    working_dir: /app/phase2/backend

  frontend:
    build:
      context: ..
      dockerfile: ./phase-4/docker/frontend.dev.Dockerfile
    container_name: phase4-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    working_dir: /app/phase2/frontend
    depends_on:
      - backend

networks:
  default:
    name: phase4-dev-network