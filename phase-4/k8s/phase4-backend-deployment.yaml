apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase4-backend-deployment
  labels:
    app: phase4-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase4-backend
  template:
    metadata:
      labels:
        app: phase4-backend
    spec:
      containers:
      - name: phase4-backend
        image: phase4-backend:v1
        imagePullPolicy: Never  # Since we're using Minikube with locally built images
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10