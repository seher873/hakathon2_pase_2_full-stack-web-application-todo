apiVersion: v1
kind: Service
metadata:
  name: phase4-backend-service
  labels:
    app: phase4-backend
spec:
  selector:
    app: phase4-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      name: http
  type: LoadBalancer  # Using LoadBalancer for easy access in Minikube