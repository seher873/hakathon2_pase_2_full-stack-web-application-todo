version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001/api
    restart: unless-stopped

  backend:
    build:
      context: ../../phase-4
      dockerfile: Dockerfile
    ports:
      - "4001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped