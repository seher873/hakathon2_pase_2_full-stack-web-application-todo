[build]
  base = "phase2/frontend"
  command = "cd phase2/frontend && npm install && npm run build"
  publish = "phase2/frontend/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_BASE_URL = "https://your-backend-url.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Context for Phase 3 frontend deployment (Create React App)
[context.phase3]
  base = "phase3/frontend"
  command = "cd phase3/frontend && npm install && npm run build"
  publish = "phase3/frontend/build"
