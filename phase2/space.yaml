# Hugging Face Spaces Configuration
# For deploying the Todo App with AI Chatbot

# Space SDK
sdk: docker

# Container configuration
container:
  port: 4001

# Environment variables
env:
  - name: DATABASE_URL
    value: sqlite:///./app.db
  - name: PORT
    value: "4001"

# Resources
resources:
  cpu: small
  memory: 512MB

# Health check
health:
  endpoint: /health
  port: 4001
  timeout: 30

# Build context
build:
  context: backend
  dockerfile: Dockerfile

# Ports
ports:
  - port: 4001
    protocol: http

# Persistent storage
storage:
  - mount_path: /app/data
    size: 1GB
