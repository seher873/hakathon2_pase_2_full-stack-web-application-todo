openapi: 3.0.0
info:
  title: AI Chat API for Todo Application
  description: API for natural language processing and skill orchestration
  version: 1.0.0

paths:
  /api/chat:
    post:
      summary: Process natural language command
      description: Parses natural language input and executes appropriate skills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successfully processed command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid command or bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check endpoint
      description: Returns service status and dependency health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: Natural language command from user
          example: "Add buy groceries to my tasks"
        context:
          type: object
          description: Optional context information
          properties:
            timezone:
              type: string
              example: "America/New_York"
            locale:
              type: string
              example: "en-US"

    ChatResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        message:
          type: string
          description: Human-readable response message
        intent:
          type: string
          description: Detected intent (for debugging)
          example: "create_task"
        result:
          $ref: '#/components/schemas/SkillResult'
          
    SkillResult:
      type: object
      description: Result from executed skill
      properties:
        skill:
          type: string
          description: Name of executed skill
          example: "create_task"
        status:
          type: string
          description: Status of skill execution
          enum: [success, failed, partial]
        data:
          type: object
          description: Data returned by skill execution

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: False for error responses
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, degraded, unhealthy]
          example:
            backend_api: healthy
            database: healthy
            jwt_validator: healthy

security:
  - bearerAuth: []

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
