# Production values for todo-app

# Backend configuration
backend:
  image:
    repository: todo-app-backend
    tag: v1.0.0
    pullPolicy: Always
  
  replicaCount: 3
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  # Environment variables for the backend (production)
  env:
    DATABASE_URL: "postgresql://user:password@postgres:5432/todo_prod_db"
    API_KEY: ""

# Frontend configuration
frontend:
  image:
    repository: todo-app-frontend
    tag: v1.0.0
    pullPolicy: Always
  
  replicaCount: 3
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
  
  # Environment variables for the frontend (production)
  env:
    NEXT_PUBLIC_API_URL: "https://api.todo-app.com"

# Ingress configuration for production
ingress:
  enabled: true
  className: "nginx"
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: todo-app.com
      paths:
        - path: /
          pathType: Prefix
          backendService: frontend
        - path: /api(/|$)(.*)
          pathType: Prefix
          backendService: backend
  tls:
    - secretName: todo-app-tls
      hosts:
        - todo-app.com

# Database configuration (production)
database:
  host: "postgres-prod"
  port: 5432
  name: "todo_prod_db"
  secretName: "db-secret-prod"